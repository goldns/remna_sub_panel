# The trusted frontend proxy normalizes X-Forwarded-For. Direct requests fall back to the peer address.
map $http_x_forwarded_for $subscription_rate_key {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}

limit_req_zone $subscription_rate_key zone=subscription_dynamic:10m rate=5r/s;

server {
    listen 80;
    server_name example.com;

    root /var/www/sub;
    index index.php;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Disable directory listing
    autoindex off;

    # Block all dot-files and dot-directories (.git, .env, .htaccess, etc.)
    location ~ /\. {
        deny all;
    }

    # Block direct access to config and internal PHP files
    location ~* ^/(config\.php|conf\.php|template\.php|functions\.php|storage\.php|happ\.php|browser\.php) {
        deny all;
    }

    # Block direct access to /templates/, /cache/, and /data/ directories
    location ~* ^/(templates|cache|data)(/|$) {
        deny all;
    }

    # Block sensitive file types
    location ~* \.(cache|conf|example|sqlite|txt|json|md)$ {
        deny all;
    }

    # Route /{shortUuid} → index.php?id={shortUuid}
    location ~* ^/([A-Za-z0-9_\-]+)/?$ {
        try_files $uri $uri/ /index.php?id=$1&$args;
    }

    # PHP-FPM — no browser caching for dynamic responses
    location ~ \.php$ {
        try_files $uri =404;
        limit_req zone=subscription_dynamic burst=10 nodelay;
        limit_req_status 429;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        expires -1;
    }

    # Static assets — no browser caching
    location /assets/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # Fallback: serve file or 404
    location / {
        try_files $uri $uri/ =404;
    }
}
